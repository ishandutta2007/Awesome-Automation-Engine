<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accent-cyan-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <pattern id="tech-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6" />
      <circle cx="40" cy="0" r="1.5" fill="#334155" />
    </pattern>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(-20px, 15px); opacity: 0.65; }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -100; }
    }
    @keyframes nodePing {
      0%, 100% { r: 5px; opacity: 0.5; }
      50% { r: 9px; opacity: 1; }
    }
    @keyframes floatBadge {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .orb-anim { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: center; }
    .stream-line { stroke-dasharray: 8 12; animation: dashMove 2.5s linear infinite; }
    .ping-circle { animation: nodePing 3s ease-in-out infinite; }
    .floating-card { animation: floatBadge 4s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-grad)" />

  <!-- Animated Glowing Mesh Orbs (strictly background) -->
  <circle class="orb-anim" cx="200" cy="80" r="140" fill="url(#glow-grad)" />
  <circle class="orb-anim" cx="1020" cy="300" r="180" fill="#8b5cf6" opacity="0.15" filter="url(#neon-glow)" />

  <!-- Background Isometric Grid -->
  <rect width="1200" height="400" rx="16" fill="url(#tech-grid)" opacity="0.8" />

  <!-- Circuit / Workflow Pipelines in Background -->
  <g opacity="0.45">
    <path class="stream-line" d="M 80 320 C 300 320, 320 180, 560 180 S 800 280, 1120 280" fill="none" stroke="#06b6d4" stroke-width="2.5" />
    <path class="stream-line" d="M 120 100 C 350 100, 420 260, 720 260 S 960 120, 1140 120" fill="none" stroke="#a855f7" stroke-width="2" style="animation-duration: 4s;" />
  </g>

  <!-- Connected Workflow Nodes -->
  <g>
    <circle cx="280" cy="245" r="5" fill="#38bdf8" class="ping-circle" />
    <circle cx="560" cy="180" r="6" fill="#a855f7" />
    <circle cx="800" cy="280" r="5" fill="#ec4899" class="ping-circle" style="animation-delay: 1.5s;" />
  </g>

  <!-- Foreground Main Branding & Typography -->
  <!-- Header Pill Badge -->
  <g transform="translate(420, 48)">
    <rect width="360" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="20" cy="17" r="5" fill="#10b981" />
    <text x="36" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">CURATED AUTOMATION ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1" fill="#f8fafc" filter="url(#subtle-shadow)">
    Awesome Automation Engine
  </text>

  <!-- Gradient Accent Bar -->
  <rect x="450" y="182" width="300" height="4" rx="2" fill="url(#accent-cyan-purple)" />

  <!-- Subtitle / Tagline -->
  <text x="600" y="226" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
    Enterprise SaaS &amp; Battle-Tested Open-Source Orchestration Engines
  </text>

  <!-- Feature Pills / Highlights -->
  <g transform="translate(185, 275)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="44" rx="22" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="90" y="27" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Workflow Engines</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(210, 0)">
      <rect width="190" height="44" rx="22" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="95" y="27" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🤖 Enterprise RPA</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(430, 0)">
      <rect width="190" height="44" rx="22" fill="#0f172a" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="95" y="27" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📊 Data Pipelines</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(650, 0)">
      <rect width="180" height="44" rx="22" fill="#0f172a" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="90" y="27" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🌐 iPaaS &amp; Webhooks</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="100" y1="360" x2="1100" y2="360" stroke="#1e293b" stroke-width="1" />
  <circle cx="600" cy="360" r="3" fill="#64748b" />
</svg>
